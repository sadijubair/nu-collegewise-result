<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collegewise Result</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script type="text/javascript">
    function updateTextField() {
      var select = document.getElementById("m_college_name_option");
      var option = select.options[select.selectedIndex];
      document.getElementById("m_college_name").value = option.value;
    }
  </script>
</head>
<body class="bg-gray-100 p-4">
  <h1 class="text-3xl font-bold text-center mb-8">Collegewise Result for National University of Bangladesh</h1> 
  <div class="content bg-white p-6 rounded shadow-md">
    <p class="text-center text-2xl text-blue-500 mb-4">Honours First Year</p>

    <div class="text-xl font-bold mb-2">Select Subject</div>
    <div class="box-body mb-4">
      <select class="w-full p-2 border rounded" name="sub_name" id="sub_name">
        <!-- Options here -->
        <option value="25"> ACCOUNTING </option>
        <option value="40"> ANTHROPOLOGY </option>
        <option value="12"> ARABIC </option>
        <option value="10"> BENGALI </option>
        <option value="29"> BIOCHEMISTRY </option>
        <option value="30"> BOTANY </option>
        <option value="28"> CHEMISTRY </option>
        <option value="22"> ECONOMICS </option>
        <option value="11"> ENGLISH </option>
        <option value="44"> ENVIRONMENTAL SCIENCE </option>
        <option value="24"> FINANCE & BANKING </option>
        <option value="32"> GEOGRAPHY & ENVIRONMENT </option>
        <option value="15"> HISTORY </option>
        <option value="35"> HOME ECONOMICS </option>
        <option value="16"> ISLAMIC HISTORY & CULTURE </option>
        <option value="18"> ISLAMIC STUDIES </option>
        <option value="26"> MANAGEMENT </option>
        <option value="23"> MARKETING </option>
        <option value="37"> MATHEMATICS </option>
        <option value="17"> PHILOSOPHY </option>
        <option value="27"> PHYSICS </option>
        <option value="19"> POLITICAL SCIENCE </option>
        <option value="34"> PSYCHOLOGY </option>
        <option value="20"> SOCIOLOGY </option>
        <option value="33"> SOIL SCIENCE </option>
        <option value="36"> STATISTICS </option>
        <option value="31"> ZOOLOGY </option>
        <option value="38">LIBRARY AND INFORMATION SCIENCE</option>
        <option value="13">SANSKRIT</option>
        <option value="21">SOCIAL WORK / WELFARE </option>
      </select>
    </div>

    <div class="text-xl font-bold mb-2">College</div>
    <div class="box-body mb-4">
      <p class="bg-blue-100 text-blue-500 text-center text-xl p-2 rounded">Select College :</p> 
      <select class="w-full p-2 border rounded mt-2" name="m_college_name_option" id="m_college_name_option" onchange="updateTextField()">
        <!-- Options here -->
      </select>
      <p class="text-center text-xl text-black my-4">Or</p>
      <p class="bg-blue-100 text-blue-500 text-center text-xl p-2 rounded">Type College Code:</p>
      <input class="w-full p-2 border rounded mt-2" type="number" name="m_college_name" id="m_college_name" value="2101" size="15" maxlength="10">
    </div>

    <div class="text-xl font-bold mb-2">Enter Year</div>
    <div class="box-body mb-4">
      <input class="w-full p-2 border rounded mt-2" name="exam_year" type="number" id="exam_year" size="15" maxlength="4">
    </div>

    <input class="w-full p-2 bg-blue-500 text-white rounded cursor-pointer" type="submit" name="submit" value="Show Collegewise Result">

    <p class="text-right mt-4">by Md. Mehedi Hasan <a class="text-blue-500" href="response_form.html">[Send Feedback]</a></p>
  </div>
</body>
</html>
